name: Build & Push nginx-geoip2

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: nginx-geoip2

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 读取版本号（.env 为唯一修改处）
        id: args
        run: |
          set -a
          . ./.env
          set +a
          echo "nginx=$NGINX_VERSION" >> "$GITHUB_OUTPUT"
          echo "geoip2=$GEOIP2_MODULE_VERSION" >> "$GITHUB_OUTPUT"

      - name: 计算镜像名（GHCR 要求全小写）
        id: image
        run: |
          echo "ghcr=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "hub=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/nginx-geoip2" >> "$GITHUB_OUTPUT"

      - name: 生成发布镜像列表
        id: images
        run: |
          IMAGES="${{ steps.image.outputs.ghcr }}"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            IMAGES="$IMAGES,${{ steps.image.outputs.hub }}"
          fi
          echo "list=$IMAGES" >> "$GITHUB_OUTPUT"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: github.event_name != 'pull_request' && env.DH_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签（latest + 版本号）
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ steps.args.outputs.nginx }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.image.outputs.ghcr }}:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NGINX_VERSION=${{ steps.args.outputs.nginx }}
            GEOIP2_MODULE_VERSION=${{ steps.args.outputs.geoip2 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试（验证模块能正常加载）
        run: |
          docker run --rm \
            ${{ steps.image.outputs.ghcr }}:smoke \
            nginx -t
