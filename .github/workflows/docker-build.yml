name: Build & Push nginx-geoip2

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      nginx_version:
        description: nginx 版本（留空用默认 1.30.4）
        required: false
        default: '1.30.4'
      geoip2_version:
        description: ngx_http_geoip2_module 版本（留空用默认 3.4）
        required: false
        default: '3.4'

env:
  IMAGE_NAME: nginx-geoip2
  NGINX_VERSION: '1.30.4'
  GEOIP2_VERSION: '3.4'

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确定构建参数
        id: args
        run: |
          echo "nginx=${{ github.event.inputs.nginx_version || env.NGINX_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "geoip2=${{ github.event.inputs.geoip2_version || env.GEOIP2_VERSION }}" >> "$GITHUB_OUTPUT"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nginx-${{ steps.args.outputs.nginx }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NGINX_VERSION=${{ steps.args.outputs.nginx }}
            GEOIP2_MODULE_VERSION=${{ steps.args.outputs.geoip2 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试（验证模块能正常加载）
        run: |
          docker run --rm \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:smoke \
            nginx -t
